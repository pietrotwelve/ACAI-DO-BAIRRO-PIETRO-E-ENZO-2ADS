<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Açaí do Bairro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Açaí do Bairro</h1>

  <h2>1. Tamanho do copo</h2>
  <label><input type="radio" name="tamanho" value="12" data-ml="300" data-max="2" checked> 300ml - R$ 12,00</label>
  <label><input type="radio" name="tamanho" value="18" data-ml="500" data-max="4"> 500ml - R$ 18,00</label>

  <h2>2. Adicionais (<span id="max">máximo 2</span>)</h2>
  <label><input type="checkbox" name="extra" value="2" data-nome="Leite em pó"> Leite em pó - R$ 2,00</label>
  <label><input type="checkbox" name="extra" value="2" data-nome="Banana"> Banana - R$ 2,00</label>
  <label><input type="checkbox" name="extra" value="2.5" data-nome="Granola"> Granola - R$ 2,50</label>
  <label><input type="checkbox" name="extra" value="3" data-nome="Leite condensado"> Leite condensado - R$ 3,00</label>
  <label><input type="checkbox" name="extra" value="3.5" data-nome="Morango"> Morango - R$ 3,50</label>
  <label><input type="checkbox" name="extra" value="3" data-nome="Paçoca"> Paçoca - R$ 3,00</label>
  <p id="aviso" class="erro"></p>

  <h2>3. Dados da entrega</h2>
  <label>Nome <input id="nome"></label>
  <label>Telefone com DDD <input id="telefone" placeholder="(41) 99999-9999"></label>
  <label>Bairro
    <select id="bairro"></select>
  </label>
  <p id="erro" class="erro"></p>

  <p>Açaí: <span id="subtotal"></span></p>
  <p>Entrega: <span id="entrega"></span></p>
  <p><strong>Total: <span id="total"></span></strong></p>

  <button id="confirmar">Confirmar pedido</button>
  <p id="resultado"></p>

  <script src="script.js"></script>
</body>
</html>
